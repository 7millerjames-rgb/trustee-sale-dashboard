<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Trustee Sale Leads</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --accent: #4f8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #gate .box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  #gate h1 { font-size: 18px; margin: 0 0 16px; }
  #gate input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0c0e12;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  #gate button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #gate button:hover { opacity: 0.9; }
  #gate .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

  #app { display: none; padding: 24px; max-width: 1100px; margin: 0 auto; }
  #app.visible { display: block; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.03em; }
  tr:hover td { background: #1c2028; }
  .score { font-weight: 600; color: var(--accent); }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #3a2a12;
    color: #ffb454;
    margin-left: 6px;
  }
  .badge-new {
    background: #123a1f;
    color: #4ade80;
  }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 20px; text-align: center; }
  .filing-link {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #1c2028;
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    white-space: nowrap;
  }
  .filing-link:hover { background: #232833; }
  .stats { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .controls { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls input {
    width: 100%;
    max-width: 320px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0c0e12;
    color: var(--text);
    font-size: 13px;
  }
  .controls input:focus { outline: 1px solid var(--accent); }
  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #1c2028;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #232833; }
  .copy-btn {
    display: inline-block;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 0 0 0 6px;
    vertical-align: middle;
  }
  .copy-btn:hover { color: var(--accent); }
  .copy-btn.copied { color: #4ade80; }
</style>
</head>
<body>

  <div id="gate">
    <div class="box">
      <h1>Trustee Sale Leads — Private Access</h1>
      <input type="password" id="pw" placeholder="Enter password" autofocus>
      <button id="unlock">Unlock</button>
      <div class="error" id="err"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <h1>Trustee Sale Leads</h1>
      <div class="meta" id="generated"></div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="controls">
      <input type="text" id="search" placeholder="Filter by owner name…">
      <button class="btn" id="export-csv">Export CSV</button>
    </div>
    <table id="table">
      <thead>
        <tr>
          <th>Filed</th>
          <th>Likely Owner(s)</th>
          <th>Other Names on Filing</th>
          <th>Recording #</th>
          <th>Score</th>
          <th>Filing</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">No leads found.</div>
    <footer>Private link — do not share outside your team.</footer>
  </div>

<script>
  // Replaced at publish time with the real SHA-256 hash of the shared password.
  const PASSWORD_HASH = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8";

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  // Backend stores/publishes times in UTC; leads are Maricopa County (Arizona)
  // filings, so display in Arizona local time for the people reading this.
  function formatArizonaTime(utcString) {
    if (!utcString || utcString === "unknown") return "unknown";
    const isoish = utcString.replace(" UTC", "Z").replace(" ", "T");
    const date = new Date(isoish);
    if (isNaN(date.getTime())) return utcString;
    const formatted = date.toLocaleString("en-US", {
      timeZone: "America/Phoenix",
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });
    return formatted + " AZ";
  }

  async function tryUnlock() {
    const pw = document.getElementById("pw").value;
    const hash = await sha256Hex(pw);
    if (hash === PASSWORD_HASH) {
      sessionStorage.setItem("tsm_unlocked", "1");
      showApp();
    } else {
      document.getElementById("err").textContent = "Incorrect password.";
    }
  }

  document.getElementById("unlock").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", e => {
    if (e.key === "Enter") tryUnlock();
  });

  function showApp() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").classList.add("visible");
    loadData();
  }

  // Full lead list from the last successful fetch, sorted by score. The
  // search box filters this in memory rather than re-fetching.
  let allLeads = [];

  // Rows currently displayed (after filtering) — CSV export mirrors this,
  // not the full unfiltered list.
  let currentRows = [];

  // Counts how many rows have the manual-review flag set.
  function countNeedsReview(rows) {
    return rows.filter(row => row.needs_manual_review && row.needs_manual_review.trim()).length;
  }

  function updateStats(rows) {
    const statsEl = document.getElementById("stats");
    const total = allLeads.length;
    const totalReview = countNeedsReview(allLeads);
    if (rows.length === total) {
      statsEl.textContent = `${total} lead${total === 1 ? "" : "s"} · ${totalReview} need review`;
    } else {
      statsEl.textContent = `Showing ${rows.length} of ${total} leads · ${countNeedsReview(rows)} need review`;
    }
  }

  function renderRows(rows) {
    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    const emptyEl = document.getElementById("empty");
    if (rows.length === 0) {
      emptyEl.textContent = "No leads found.";
      emptyEl.style.display = "block";
    } else {
      emptyEl.style.display = "none";
    }
    updateStats(rows);
    currentRows = rows;
    rows.forEach(row => {
      const tr = document.createElement("tr");
      const reviewBadge = row.needs_manual_review && row.needs_manual_review.trim()
        ? '<span class="badge">review</span>' : "";
      const newBadge = row.is_new === true || row.is_new === "true" || row.is_new === "True"
        ? '<span class="badge badge-new">NEW</span>' : "";
      const filingLink = row.filing_url
        ? `<a class="filing-link" href="${row.filing_url}" target="_blank" rel="noopener noreferrer">View PDF</a>`
        : "";
      const recordingNumber = row.recording_number || "";
      const copyBtn = recordingNumber
        ? `<button class="copy-btn" data-recording="${recordingNumber}" title="Copy recording number">⧉</button>`
        : "";
      tr.innerHTML = `
        <td>${row.recording_date || ""}</td>
        <td>${row["likely_owner(s)"] || ""}${newBadge}${reviewBadge}</td>
        <td>${row.other_names_on_filing || ""}</td>
        <td>${recordingNumber}${copyBtn}</td>
        <td class="score">${row.score || ""}</td>
        <td>${filingLink}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function applyFilter() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const filtered = q
      ? allLeads.filter(row => (row["likely_owner(s)"] || "").toLowerCase().includes(q))
      : allLeads;
    renderRows(filtered);
  }

  async function loadData() {
    try {
      const res = await fetch("leads.json", { cache: "no-store" });
      const data = await res.json();
      document.getElementById("generated").textContent =
        "Last updated: " + formatArizonaTime(data.generated_at_utc);
      allLeads = (data.leads || [])
        .slice()
        .sort((a, b) => Number(b.score || 0) - Number(a.score || 0));
      applyFilter();
    } catch (e) {
      document.getElementById("empty").textContent = "Couldn't load leads data.";
      document.getElementById("empty").style.display = "block";
    }
  }

  document.getElementById("search").addEventListener("input", applyFilter);

  // Event delegation on the tbody: rows are re-rendered on every filter/load,
  // so a listener attached to individual buttons would be lost (or, if
  // re-added each render, duplicated). Binding once on the stable parent
  // avoids both problems.
  document.getElementById("rows").addEventListener("click", e => {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;
    const recording = btn.dataset.recording;
    navigator.clipboard.writeText(recording).then(() => {
      const original = btn.textContent;
      btn.textContent = "✓";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove("copied");
      }, 1200);
    });
  });

  // Wraps a CSV field in quotes and escapes embedded quotes whenever the
  // value contains a comma, quote, or newline that would otherwise break
  // column alignment.
  function csvField(value) {
    const str = String(value == null ? "" : value);
    if (/[",\n]/.test(str)) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  // Exports whatever rows are currently visible (i.e. respects the active
  // owner-name filter) using the same columns shown in the table.
  function exportCsv() {
    const header = ["Filed", "Likely Owner(s)", "Other Names on Filing", "Recording #", "Score", "Filing URL"];
    const lines = [header.map(csvField).join(",")];
    currentRows.forEach(row => {
      lines.push([
        csvField(row.recording_date || ""),
        csvField(row["likely_owner(s)"] || ""),
        csvField(row.other_names_on_filing || ""),
        csvField(row.recording_number || ""),
        csvField(row.score || ""),
        csvField(row.filing_url || "")
      ].join(","));
    });
    const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `trustee-sale-leads-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("export-csv").addEventListener("click", exportCsv);

  // Skip the password prompt if already unlocked earlier this tab session.
  if (sessionStorage.getItem("tsm_unlocked") === "1") {
    showApp();
  }
</script>

</body>
</html>
